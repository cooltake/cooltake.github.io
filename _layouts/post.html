---
layout: default
---
<style>
  /* ── Post page: Panel B (light card on dark bg) ── */
  body { background: linear-gradient(160deg,#111b2e 0%,#0d1525 50%,#111827 100%) !important; }

  .post-header {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg,#0e1929 0%,#0b1220 60%,#101827 100%);
    padding: 80px 0 56px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .post-header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 80% at 50% 0%,rgba(59,130,246,.16) 0%,transparent 70%);
    pointer-events: none;
  }
  .post-header .container { position: relative; z-index: 1; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #8896b3; font-size: .85rem; font-weight: 500;
    margin-bottom: 32px; text-decoration: none;
    transition: color .2s;
  }
  .back-link:hover { color: #f1f5ff; }

  .post-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .post-tag {
    background: rgba(59,130,246,.1); color: #93c5fd;
    border: 1px solid rgba(59,130,246,.2);
    padding: 4px 12px; border-radius: 9999px;
    font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .post-date { color: #8896b3; font-size: .82rem; }

  .post-title {
    font-family: 'Kiwi Maru','Noto Sans JP',serif;
    font-size: clamp(1rem,2.2vw,1.6rem);
    font-weight: 400; letter-spacing: .02em; line-height: 1.55;
    color: #f1f5ff;
  }

  .post-body { padding: 48px 5% 80px; }

  .post-content {
    max-width: 900px; margin: 0 auto;
    font-size: 1.025rem; line-height: 1.95;
    background: #d6d5d2; color: #1c1c2e;
    border-radius: 16px;
    padding: 48px 12%;
    box-shadow: 0 4px 40px rgba(0,0,0,.65);
  }

  .post-content h2 {
    font-size: 1.45rem; font-weight: 800; letter-spacing: -.025em;
    margin: 52px 0 16px; padding-left: 18px;
    border-left: 4px solid #3b82f6; color: #111827;
  }
  .post-content h2:first-of-type { margin-top: 0; }
  .post-content h3 {
    font-size: 1.08rem; font-weight: 700; letter-spacing: -.01em;
    margin: 36px 0 12px; color: #1d4ed8;
  }
  .post-content h4 { font-size: .97rem; font-weight: 700; margin: 28px 0 10px; color: #111827; }
  .post-content p { margin-bottom: 20px; color: #374151; }
  .post-content a { color: #2563eb; border-bottom: 1px solid rgba(37,99,235,.25); text-decoration: none; }
  .post-content a:hover { border-bottom-color: #2563eb; }
  .post-content ul, .post-content ol { margin: 16px 0 24px 28px; }
  .post-content li { margin-bottom: 8px; color: #374151; }
  .post-content strong { color: #111827; font-weight: 700; }
  .post-content hr { border: none; border-top: 1px solid #c4c3c0; margin: 40px 0; }

  .post-content table { width: 100%; border-collapse: collapse; margin: 28px 0; font-size: .875rem; }
  .post-content th {
    background: rgba(59,130,246,.08); padding: 12px 16px;
    border: 1px solid #d1d5db; font-weight: 700; text-align: left; color: #111827;
  }
  .post-content td { padding: 12px 16px; border: 1px solid #d1d5db; color: #374151; }
  .post-content tr:nth-child(even) td { background: #cccbc8; }

  .post-content figure { margin: 32px -2px; }
  .post-content figure img { max-width: 100%; border-radius: 10px; display: block; }
  .post-content figcaption { font-size: .75rem; color: #6b7280; margin-top: 8px; text-align: center; }

  .ad-notice {
    display: inline-block; font-size: .78rem;
    color: #6b7280; background: #c8c7c4; border: 1px solid #b4b3b0;
    padding: 6px 14px; border-radius: 8px; margin-bottom: 28px;
  }

  /* hero thumbnail */
  .hero-img-wrap { margin: 0 0 36px; }
  .hero-img-wrap img { width: 100%; border-radius: 10px; display: block; }
  .hero-img-wrap figcaption {
    font-family: 'BIZ UDPGothic','Noto Sans JP',sans-serif;
    font-size: .8rem; color: #6b7280; margin-top: 6px; text-align: center;
  }

  /* blockquote / callout */
  .post-content blockquote {
    border-left: 4px solid #3b82f6;
    background: #c8c7c4; margin: 28px 0;
    padding: 16px 20px; border-radius: 0 8px 8px 0;
    color: #374151; font-style: normal;
  }

  @media (max-width: 768px) {
    .post-content { padding: 32px 6%; }
    .post-body { padding: 32px 3% 60px; }
  }
</style>

<article>
  <div class="post-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="back-link">← 記事一覧に戻る</a>
      <div class="post-meta">
        <span class="post-tag">{{ page.categories | first | default: "Guide" | upcase }}</span>
        <span class="post-date">{{ page.date | date: "%Y.%m.%d" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </div>
  <div class="post-body">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
