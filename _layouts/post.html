---
layout: default
---
<style>
  body { background: linear-gradient(160deg,#111b2e 0%,#0d1525 50%,#111827 100%) !important; }

  .post-header {
    position: relative; overflow: hidden;
    background-color: #0b1220;
    background-image: none;
    background-size: cover;
    background-position: center center;
    padding: 56px 0 32px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  /* hero画像がある場合: 暗いグラデーション + 画像を1つのbackground-imageで重ねる */
  .post-header.has-hero {
    background-image:
      linear-gradient(to bottom,
        rgba(6,12,24,0.82) 0%,
        rgba(6,12,24,0.88) 100%),
      var(--hero-img);
    background-size: cover;
    background-position: center center;
  }
  /* 青いグロー装飾 */
  .post-header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 80% at 50% 0%,rgba(59,130,246,.10) 0%,transparent 70%);
    pointer-events: none;
  }
  .post-header .container { position: relative; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #8896b3; font-size: .85rem; font-weight: 500;
    margin-bottom: 24px; text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: #f1f5ff; }

  .post-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .post-tag {
    background: rgba(59,130,246,.15); color: #93c5fd;
    border: 1px solid rgba(59,130,246,.25);
    padding: 4px 12px; border-radius: 9999px;
    font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .post-date { color: #8896b3; font-size: .82rem; }

  .post-title {
    font-family: 'Kiwi Maru','Noto Sans JP',serif;
    font-size: clamp(1rem,2.2vw,1.6rem);
    font-weight: 400; letter-spacing: .02em; line-height: 1.55;
    color: #f1f5ff; margin-bottom: 0;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }

  /* カード = 画面の90%（左右5%ずつ）、ヘッダーとの隙間を詰める */
  .post-body { padding: 20px 5% 60px; }

  .post-content {
    max-width: 100%;
    background: #d6d5d2; color: #1c1c2e;
    border-radius: 16px;
    padding: 48px 12.5%;
    box-shadow: 0 4px 40px rgba(0,0,0,.65);
  }

  /* テキスト表示領域 max 1000px */
  .post-inner {
    max-width: 1000px;
    margin: 0 auto;
    font-size: 1.025rem; line-height: 1.95;
  }

  .post-inner h2 {
    font-size: 1.45rem; font-weight: 800; letter-spacing: -.025em;
    margin: 52px 0 16px; padding-left: 18px;
    border-left: 4px solid #3b82f6; color: #111827;
  }
  .post-inner h2:first-of-type { margin-top: 0; }
  .post-inner h3 {
    font-size: 1.08rem; font-weight: 700; letter-spacing: -.01em;
    margin: 36px 0 12px; color: #1d4ed8;
  }
  .post-inner h4 { font-size: .97rem; font-weight: 700; margin: 28px 0 10px; color: #111827; }
  .post-inner p { margin-bottom: 20px; color: #374151; }
  .post-inner a { color: #2563eb; border-bottom: 1px solid rgba(37,99,235,.25); text-decoration: none; }
  .post-inner a:hover { border-bottom-color: #2563eb; }
  .post-inner ul, .post-inner ol { margin: 16px 0 24px 28px; }
  .post-inner li { margin-bottom: 8px; color: #374151; }
  .post-inner strong { color: #111827; font-weight: 700; }
  .post-inner hr { border: none; border-top: 1px solid #c4c3c0; margin: 40px 0; }

  .post-inner table { width: 100%; border-collapse: collapse; margin: 28px 0; font-size: .875rem; }
  .post-inner th {
    background: rgba(59,130,246,.08); padding: 12px 16px;
    border: 1px solid #d1d5db; font-weight: 700; text-align: left; color: #111827;
  }
  .post-inner td { padding: 12px 16px; border: 1px solid #d1d5db; color: #374151; }
  .post-inner tr:nth-child(even) td { background: #cccbc8; }

  .post-inner figure { margin: 32px 0; }
  .post-inner figure img { max-width: 100%; border-radius: 10px; display: block; }
  .post-inner figcaption { font-size: .75rem; color: #6b7280; margin-top: 8px; text-align: center; }

  .ad-notice {
    display: inline-block; font-size: .78rem;
    color: #6b7280; background: #c8c7c4; border: 1px solid #b4b3b0;
    padding: 6px 14px; border-radius: 8px; margin-bottom: 28px;
  }

  .post-inner blockquote {
    border-left: 4px solid #3b82f6; background: #c8c7c4;
    margin: 28px 0; padding: 16px 20px;
    border-radius: 0 8px 8px 0; color: #374151; font-style: normal;
  }

  @media (max-width: 768px) {
    .post-content { padding: 32px 6%; }
    .post-body { padding: 16px 3% 48px; }
    .post-header { padding: 48px 0 28px; }
  }
</style>

<article>
  <div class="post-header{% if page.image %} has-hero{% endif %}"{% if page.image %} style="--hero-img: url('{{ page.image }}');"{% endif %}>
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="back-link">← 記事一覧に戻る</a>
      <div class="post-meta">
        <span class="post-tag">{{ page.categories | first | default: "Guide" | upcase }}</span>
        <span class="post-date">{{ page.date | date: "%Y.%m.%d" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </div>
  <div class="post-body">
    <div class="post-content">
      <div class="post-inner">
        {{ content }}
      </div>
    </div>
  </div>
</article>
