---
layout: default
---
<article>
  <div class="post-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="back-link">← 記事一覧</a>
      <div class="post-meta">
        <span class="post-tag">{{ page.categories | first | default: "Guide" | upcase }}</span>
        <span class="post-date">{{ page.date | date: "%Y.%m.%d" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </div>
  <div class="container">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
