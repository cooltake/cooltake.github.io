<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Cooltake Studio</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;0,9..40,900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo">
        <div class="logo-badge">♩</div>
        <span class="logo-main">Cooltake <span class="logo-dot">Studio</span></span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">記事一覧</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo-badge" style="width:28px;height:28px;border-radius:8px;font-size:.9rem;">♩</div>
          <span>Cooltake Studio</span>
        </div>
        <div class="footer-links">
          <a href="{{ '/' | relative_url }}">記事一覧</a>
        </div>
      </div>
      <p class="footer-copy">本サイトはアフィリエイト広告を利用しています &nbsp;|&nbsp; &copy; 2026 Cooltake Studio All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
